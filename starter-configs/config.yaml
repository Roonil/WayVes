# yaml-language-server: $schema=./schemas/WayVes_config_schema.json

audios:
  - name: audio1
    pipewire-settings:
      sample-rate: 11000
      channels: 2
      sample-size: 1024
      fragment-size: 4096
      capture-mic: false
      audio-format: F32_LE

    shaders:
      - name: linear
        margin-bottom: 30
        margin-left: 30
        anchor-left: true
        anchor-bottom: true
        layer: Bottom
        window-width: 300
        window-height: 200

      - name: angular
        margin-bottom: 30
        margin-right: 30
        anchor-right: true
        anchor-bottom: true
        layer: Bottom
        window-width: 300
        window-height: 300

