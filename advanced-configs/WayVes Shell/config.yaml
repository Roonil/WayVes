      #   rendering-sockets:
      #     - ncs_grid
      #   #   - dmabuf
      #   post-processing:
      #     - name: glow
      #       passes: 1
      - name: linear
        class-name: linear_password_mask
        config-file: wayves-shell/lockscreen/password_mask.glsl
        image-textures: 1
        hot-reload: false
        initial-visibility: false
        rendering-mode: 1
        rendering-sockets:
          - password_mask
        audio-overrides:
          max-frequency: 6000
          min-frequency: 40
          # smooth-audio: false
          strict-frequency-bounds: true
          smooth-settings:
