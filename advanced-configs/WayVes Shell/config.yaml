      - name: ncs
        class-name: ncs_xmb
        config-file: wayves-shell/lockscreen/xmb.glsl
        atomic-textures: 5
        initial-visibility: false
        hot-reload: false
        fps: 60
        rendering-mode: Detached
        rendering-sockets:
          - ncs_xmb

        margin-top: 12
        anchor-left: true
        layer: Overlay
        window-width: 2560
        window-height: 700

  - name: WayVes_power_menu
    pipewire-settings:
      sample-rate: 11000
      channels: 2
      sample-size: 1024
      fragment-size: 4096
      capture-mic: false
      audio-format: F32_LE

    shaders:
      - name: angular
        class-name: hud_waves
        config-file: wayves-shell/power-menu/waves.glsl
        rendering-mode: 1
        initial-visibility: false
        hot-reload: false
        rendering-sockets:
          - hud_waves
        margin-top: 200
        margin-right: 250
        anchor-right: true
        anchor-top: true
        layer: Overlay
        window-width: 500
        window-height: 500

      - name: angular
        class-name: hud_outer_ring
        config-file: wayves-shell/power-menu/outer_ring.glsl
        initial-visibility: false
        hot-reload: false
        rendering-mode: 1

        rendering-sockets:
          - hud_outer_ring
        margin-top: 160
        fps: 30
        margin-right: -320
        anchor-right: true
        anchor-top: true
        layer: Overlay
        window-width: 1100
        window-height: 1100

      - name: angular
        class-name: hud_surface
        config-file: wayves-shell/power-menu/surface.glsl
        initial-visibility: false
        hot-reload: false
        rendering-mode: 1
        rendering-sockets:
          - hud_surface
        fps: 30
        margin-top: 160
