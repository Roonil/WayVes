      #   margin-top: 40
      #   audio-overrides:
      #     gravity-settings:
      #       gravity-step: 24.2
      #       average-frames: 5
      #   rendering-sockets:
      #     - ncs_liquid
      #   #   - dmabuf
      #   post-processing:
      #     - name: glow
      #       passes: 1

      # - name: ncs
      #   config-file: ncs_grid.glsl
      #   class-name: ncs_lockscreen
      #   rendering-mode: 1
      #   atomic-textures: 5
      #   anchor-right: true
      #   anchor-top: true
      #   layer: Overlay
      #   window-width: 2600
