# yaml-language-server: $schema=./schemas/WayVes_config_schema.json
audios:
  - name: audio1
    pipewire-settings:
      sample-rate: 11000
      channels: 2
      sample-size: 1024
      fragment-size: 4096
      capture-mic: false
      audio-format: F32_LE

    shaders:
      - name: linear
        class-name: linear_boxes
        config-file: linear_boxes.glsl
        margin-top: 511
        margin-left: 322
        anchor-left: true
        anchor-top: true
        layer: Bottom
        window-width: 290
        window-height: 211

        post-processing:
          - name: glow
            passes: 1

        audio-overrides:
          gravity-settings:
            gravity-step: 2.2
            average-frames: 20

      - name: linear
        class-name: linear_lights
        config-file: linear_lights.glsl
        margin-top: -88
        margin-left: 895
        anchor-left: true
        anchor-top: true
        layer: Bottom
        window-width: 290
        window-height: 650

        post-processing:
          - name: glow
            passes: 2

        audio-overrides:
          gravity-settings:
            average-frames: 15

      - name: linear
        class-name: linear_chain
        config-file: linear_chain.glsl
        margin-top: 50
        margin-right: 10
        anchor-right: true
        anchor-top: true
        layer: Bottom
        window-width: 340
        window-height: 250

        audio-overrides:
          gravity-settings:
            gravity-step: 1.2
            average-frames: 15

      - name: linear
        class-name: linear_bars
        config-file: linear_bars.glsl
        margin-top: 188
        margin-right: 10
        anchor-right: true
        anchor-top: true
        layer: Bottom
        window-width: 390
        window-height: 250

        audio-overrides:
          gravity-settings:
            gravity-step: 1.2
            average-frames: 15

      - name: linear
        class-name: linear_holder
        config-file: linear_holder.glsl
        margin-bottom: 328
        margin-right: 20
        anchor-right: true
        anchor-bottom: true
        layer: Bottom
        window-width: 290
        window-height: 200

        post-processing:
          - name: glow
            passes: 1

        audio-overrides:
          gravity-settings:
            average-frames: 15

      - name: linear
        class-name: linear_waves
        config-file: linear_waves.glsl
        margin-bottom: 402
        margin-right: 79
        anchor-right: true
        anchor-bottom: true
        layer: Bottom
        window-width: 120
        window-height: 50

        post-processing:
          - name: glow
            passes: 1
            
        audio-overrides:
          gravity-settings:
            average-frames: 15